<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style><meta name="theme-color" content="#F4F5F7" media="(prefers-color-scheme: light)">

<title>하루기록</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one narrow column with a bottom tab bar (홈·운동·식단·수면); home = week count, body record, month calendar, day detail; full-screen workout mode; bottom sheets for entries. */
:root {
  --bg: #F2F4F3;
  --surface: #FFFFFF;
  --ink: #18201D;
  --muted: #5F6B66;
  --line: #DCE2DF;
  --move: #D2512C;   /* 운동 */
  --food: #4E8A2C;   /* 식단 */
  --rest: #4656C2;   /* 수면 */
  --move-soft: #FBE7E0;
  --food-soft: #E4F0DC;
  --rest-soft: #E3E6F8;
  --cardio: #C98A12;   /* 유산소 */
  --f-display: "Gothic A1", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-num: "IBM Plex Mono", ui-monospace, monospace;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111614; --surface: #1A211E; --ink: #E8EEEB; --muted: #95A39D; --line: #2C3632;
    --move: #F0794F; --food: #84C25A; --rest: #8E9BFF;
    --move-soft: #3A221A; --food-soft: #1F3019; --rest-soft: #222746; --cardio: #E5B04A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111614; --surface: #1A211E; --ink: #E8EEEB; --muted: #95A39D; --line: #2C3632;
  --move: #F0794F; --food: #84C25A; --rest: #8E9BFF;
  --move-soft: #3A221A; --food-soft: #1F3019; --rest-soft: #222746; --cardio: #E5B04A;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 15px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 calc(96px + env(safe-area-inset-bottom, 0px));
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; width: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { opacity: .45; cursor: default; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; }
h2 { margin: 0; font-family: var(--f-display); font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 8px; }

header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 14px 10px; display: flex; flex-direction: column; gap: 10px; }
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.brand h1 { font-family: var(--f-display); font-weight: 800; font-size: 22px; margin: 0; letter-spacing: -0.02em; }
.sync { font-size: 12px; color: var(--muted); }
.tabs { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--line); border-radius: 10px; padding: 3px; gap: 3px; }
.tabs button { border: 0; background: transparent; padding: 7px; border-radius: 8px; font-weight: 600; color: var(--muted); }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); }

.datebar { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.datebar button.nav { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); font-size: 18px; }
.datebar .d { text-align: center; }
.datebar .d strong { display: block; font-family: var(--f-display); font-size: 18px; font-weight: 700; }
.datebar .d span { font-size: 12px; color: var(--muted); }
.todaylink { border: 0; background: none; color: var(--muted); text-decoration: underline; font-size: 12px; padding: 0; }

.summary { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.stat { background: var(--surface); border-radius: var(--r); padding: 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stat .k { font-size: 12px; color: var(--muted); letter-spacing: 0.02em; }
.stat .v { font-family: var(--f-num); font-size: 20px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.stat .v small { font-family: var(--f-body); font-size: 12px; color: var(--muted); margin-left: 2px; }
.stat .bar { height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; margin-top: 6px; }
.stat .bar i { display: block; height: 100%; }
.stat.move .bar i { background: var(--move); } .stat.food .bar i { background: var(--food); } .stat.rest .bar i { background: var(--rest); }
.stat .goal { font-size: 11px; color: var(--muted); }

section.panel { background: var(--surface); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.panel-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.btns { display: flex; gap: 6px; flex-wrap: wrap; }
.dot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex: none; }
.move .dot { background: var(--move); } .food .dot { background: var(--food); } .rest .dot { background: var(--rest); }
.add { border: 0; border-radius: 999px; padding: 6px 14px; font-weight: 600; font-size: 14px; background: var(--move-soft); color: var(--move); }
.food .add { background: var(--food-soft); color: var(--food); }
.rest .add { background: var(--rest-soft); color: var(--rest); }
.add.solid { background: var(--move); color: var(--surface); }
ul.items { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
ul.items > li { display: grid; grid-template-columns: 1fr auto auto; align-items: start; gap: 10px; padding-block: 10px; border-top: 1px solid var(--line); }
ul.items > li:first-child { border-top: 0; }
.it-main { min-width: 0; }
.it-main b { font-weight: 600; display: block; overflow-wrap: anywhere; }
.it-main span { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.it-val { font-family: var(--f-num); font-variant-numeric: tabular-nums; font-size: 14px; white-space: nowrap; text-align: right; }
.del { border: 0; background: none; color: var(--muted); width: 32px; height: 32px; border-radius: 8px; font-size: 16px; flex: none; }
.del:hover { background: var(--bg); }
.empty { color: var(--muted); font-size: 13px; margin: 0; }
.chip { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 999px; background: var(--bg); color: var(--muted); margin-right: 4px; white-space: nowrap; }
.it-main .chip.part, .chip.part { background: var(--move-soft); color: var(--move); }
.it-main .chip.ss, .chip.ss { background: var(--ink); color: var(--surface); }
.dayline { font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
.dayline b { color: var(--ink); font-family: var(--f-num); font-weight: 500; }
details.wd summary { list-style: none; cursor: pointer; }
details.wd summary::-webkit-details-marker { display: none; }
details.wd .more { text-decoration: underline; }
.wd-body { margin-top: 8px; display: flex; flex-direction: column; gap: 8px; }
.wd-ex { border-left: 3px solid var(--line); padding-left: 10px; font-size: 13px; }
.wd-ex.inss { border-left-color: var(--move); }
.wd-ex b { font-size: 14px; display: inline; }
.wd-ex .memo-t { color: var(--muted); font-size: 12px; }
.banner { background: var(--move); color: var(--surface); border: 0; border-radius: var(--r); padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; gap: 10px; font-weight: 600; text-align: left; width: 100%; }
.banner .num { font-size: 18px; }

/* bottom tabs */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 8; background: var(--surface); border-top: 1px solid var(--line);
  display: grid; grid-template-columns: repeat(4, 1fr);
  padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabbar button { border: 0; background: none; padding: 8px 0 10px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; font-weight: 600; color: var(--muted); }
.tabbar svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tabbar button[aria-selected="true"] { color: var(--ink); }
.tabbar button[data-view="work"][aria-selected="true"] { color: var(--move); }
.tabbar button[data-view="food"][aria-selected="true"] { color: var(--food); }
.tabbar button[data-view="sleep"][aria-selected="true"] { color: var(--rest); }
.tabs.sub { margin-bottom: -4px; }

/* home */
section.weekline { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; align-items: center; }
.weekline .k { display: block; font-size: 12px; color: var(--muted); }
.weekline .big { font-family: var(--f-display); font-size: 15px; }
.weekline .big b { font-family: var(--f-num); font-size: 30px; font-weight: 500; color: var(--move); margin-right: 2px; }
.wkparts { min-width: 0; }
.wkdots { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.wkdots span { text-align: center; font-size: 11px; padding: 4px 0; border-radius: 8px; background: var(--bg); color: var(--muted); }
.wkdots span.on { background: var(--move); color: var(--surface); font-weight: 600; }
.wkdots span.now { outline: 1.5px solid var(--ink); outline-offset: -1.5px; }
.body .dot { background: var(--rest); }
.bodygrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.bodygrid div { display: flex; flex-direction: column; min-width: 0; }
.bodygrid .k { font-size: 11px; color: var(--muted); }
.bodygrid .v { font-family: var(--f-num); font-size: 18px; font-variant-numeric: tabular-nums; }
.bodygrid .v small { font-family: var(--f-body); font-size: 11px; color: var(--muted); margin-left: 1px; }
.delta { font-family: var(--f-num); font-size: 11px; color: var(--muted); }
.spark { width: 100%; height: 56px; display: block; }
.nav.sm { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); font-size: 16px; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)) 30px; gap: 4px; }
.cal .ch { text-align: center; font-size: 11px; color: var(--muted); padding-bottom: 2px; }
.cal .c { position: relative; border: 0; background: var(--bg); border-radius: 9px; min-height: 58px; padding: 4px 1px; display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; overflow: hidden; }
.cal .c.out { opacity: .35; }
.cal .c .dn { font-family: var(--f-num); font-size: 12px; line-height: 18px; min-width: 20px; border-radius: 999px; }
.cal .c.today .dn { background: var(--ink); color: var(--surface); }
.cal .c.has { background: var(--move-soft); }
.cal .c.sel { box-shadow: inset 0 0 0 2px var(--ink); }
.cal .pt { font-size: 10px; line-height: 13px; padding: 0 3px; border-radius: 4px; background: var(--surface); color: var(--move); max-width: 100%; overflow: hidden; white-space: nowrap; }
.cal .pt.cd { color: var(--muted); }
.cal .pt.more { color: var(--muted); }
.cal .bd { position: absolute; top: 5px; right: 5px; width: 5px; height: 5px; border-radius: 50%; background: var(--rest); }
.cal .wkc { display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 10px; color: var(--muted); }
.cal .wkc b { font-family: var(--f-num); font-size: 15px; font-weight: 500; color: var(--ink); }
.detail .dsec { display: flex; flex-direction: column; gap: 4px; padding-top: 8px; border-top: 1px solid var(--line); }
.detail .dh { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-weight: 600; font-size: 14px; }
.detail .dh > span:first-child { display: flex; align-items: center; gap: 6px; }
.detail .dtext { margin: 0; font-size: 14px; overflow-wrap: anywhere; }
.summary.three, .view-work-sum { grid-template-columns: repeat(3, 1fr); }
.kcalrow { display: flex; align-items: baseline; gap: 6px; }
.kcalrow .big { font-size: 30px; }
.stat-bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.stat-bar i { display: block; height: 100%; background: var(--food); }
.macros { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.macros div { background: var(--bg); border-radius: 10px; padding: 8px 10px; display: flex; flex-direction: column; }
.macros .k { font-size: 11px; color: var(--muted); }
.macros b { font-family: var(--f-num); font-weight: 500; font-size: 18px; }
.macbar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--line); }
.macbar i { display: block; height: 100%; }
.sleepbig { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.sleepbig div { display: flex; flex-direction: column; }
.sleepbig .k { font-size: 12px; color: var(--muted); }
.sleepbig b { font-family: var(--f-num); font-weight: 500; font-size: 26px; }
.sleepbig .arrow { color: var(--muted); padding-bottom: 6px; }
.sleepbig .tot { margin-left: auto; }
.sleepbig .tot b { color: var(--rest); }
.diffbox { background: var(--bg); border-radius: 12px; padding: 12px; gap: 10px; }
.dchk { display: grid; grid-template-columns: 20px 1fr; gap: 10px; align-items: start; font-size: 14px; }
.dchk input { width: 18px; height: 18px; margin-top: 2px; }
.dchk .hint { overflow-wrap: anywhere; }
.ctrl { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.ctrl .pause { border: 0; border-radius: 10px; padding: 10px 16px; font-weight: 600; background: var(--ink); color: var(--surface); }
.ctrl .pause.paused { background: var(--move); }
.ctrl .hint { flex: 1; min-width: 140px; }
.work-h .t span.paused { color: var(--muted); }
@media (max-width: 380px) { .bodygrid { grid-template-columns: repeat(2, 1fr); } .cal .pt { font-size: 9px; } }

/* weekly */
.chart { display: flex; flex-direction: column; gap: 8px; }
.chart .cap { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.chart .cap span { font-size: 12px; color: var(--muted); }
.bars { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; align-items: end; height: 120px; position: relative; }
.bars .goal-line { position: absolute; left: 0; right: 0; border-top: 1px dashed var(--muted); opacity: 0.6; pointer-events: none; }
.bars .b { display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; gap: 3px; min-width: 0; }
.bars .b i { display: block; width: 100%; max-width: 28px; border-radius: 5px 5px 2px 2px; min-height: 2px; }
.bars .b em { font-style: normal; font-family: var(--f-num); font-size: 10px; color: var(--muted); white-space: nowrap; }
.labels { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; text-align: center; font-size: 11px; color: var(--muted); }
.labels .today { color: var(--ink); font-weight: 600; }
.move .bars i { background: var(--move); } .food .bars i { background: var(--food); } .rest .bars i { background: var(--rest); }
.weekavg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.partgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.partgrid button { border: 0; background: var(--bg); border-radius: 10px; padding: 8px 4px; text-align: center; font-size: 12px; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 1px; }
.partgrid button b { display: block; font-family: var(--f-num); font-size: 18px; color: var(--ink); font-weight: 500; }
.partgrid button.on { background: var(--move-soft); color: var(--move); }
.partgrid button.on b { color: var(--move); }
.tr { font-family: var(--f-num); font-size: 10px; color: var(--muted); }
.tr.up { color: var(--food); } .tr.down { color: var(--move); }
.tr.big { font-size: 15px; }
.chip.link { border: 0; cursor: pointer; font: inherit; font-size: 12px; font-weight: 600; padding: 6px 10px; min-height: 30px; }
.ichart { position: relative; padding-top: 34px; touch-action: pan-y; user-select: none; -webkit-user-select: none; cursor: crosshair; }
.ichart.empty { padding-top: 10px; cursor: default; }
.ichart svg { width: 100%; height: auto; display: block; overflow: visible; }
.ichart .tip { position: absolute; top: 0; background: var(--ink); color: var(--surface); border-radius: 8px; padding: 3px 9px; font-size: 12px; white-space: nowrap; display: flex; gap: 6px; align-items: baseline; pointer-events: none; transition: left .18s ease-out, transform .18s ease-out; }
.ichart .tip b { font-family: var(--f-num); font-weight: 500; }
.ichart .tip span { opacity: .75; font-size: 11px; }
.ichart .cursor, .ichart .hot { transition: transform .18s ease-out; }
.ichart .bar { transition: opacity .2s; }
.ichart .bar.dim { opacity: .45; }
@media (prefers-reduced-motion: no-preference) {
  .ichart .bar { transform-box: fill-box; transform-origin: 50% 100%; animation: grow .6s cubic-bezier(.2,.8,.2,1) both; animation-delay: var(--d, 0ms); }
  .ichart .val, .ichart .dotp { animation: fadein .4s ease-out both; animation-delay: calc(var(--d, 0ms) + 250ms); }
  .ichart polyline.line { stroke-dasharray: 1 0; animation: draw 1s ease-out both; }
  .ichart line.line { animation: fadein .8s ease-out .5s both; }
  .ichart .area { animation: fadein 1s ease-out both; }
  .ichart .hot, .ichart .cursor line, .ichart .tip { animation: fadein .3s ease-out .7s both; }
  @keyframes grow { from { transform: scaleY(0); } }
  @keyframes draw { from { stroke-dasharray: 0 1; } }
  @keyframes fadein { from { opacity: 0; } }
}
/* glance + visuals */
.dot.water { background: var(--water); }
.glgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.gl { background: var(--fill); border-radius: 18px; padding: 12px; display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; }
.gl > .k, .glh .k { font-size: 12px; font-weight: 700; color: var(--muted); align-self: flex-start; }
.gl-water { grid-row: span 2; justify-content: center; }
.gl-body { grid-column: 1 / -1; align-items: stretch; }
.glh { display: flex; justify-content: space-between; align-items: center; }
.beaker, .dial, .rings { border: 0; background: none; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.beaker svg { width: 100%; max-width: 130px; display: block; margin: 0 auto; }
.beaker:active svg { transform: scale(.97); }
.wfill { transform: translateY(var(--y)); transition: transform .9s cubic-bezier(.3,1.3,.5,1); }
.watercard { display: grid; grid-template-columns: 120px 1fr; gap: 14px; align-items: center; width: 100%; }
.watercard.compact { grid-template-columns: 1fr; gap: 8px; }
.wc-info { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.watercard.compact .wc-info { align-items: center; text-align: center; }
.wc-info .k { font-size: 12px; color: var(--muted); font-weight: 700; }
.watercard.compact .wc-info .k { display: none; }
.wc-info .v b { font-size: 26px; font-weight: 800; letter-spacing: -0.03em; color: var(--water); font-variant-numeric: tabular-nums; }
.wc-info .v small { font-size: 12px; color: var(--muted); margin-left: 3px; }
.wc-info .btns { margin-top: 4px; }
.watercard.compact .btns { justify-content: center; }
.watercard.compact .add { padding: 6px 10px; font-size: 12px; background: var(--surface); }
.dial svg, .rings svg { width: 100%; display: block; }
.dial { max-width: 100%; }
.rings { width: 100%; max-width: 132px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.ringleg { font-size: 11px; color: var(--muted); display: flex; flex-direction: column; gap: 2px; align-items: center; }
.ringleg i { width: 7px; height: 7px; border-radius: 50%; display: inline-block; margin-right: 4px; }
.sleeprow { display: flex; align-items: center; gap: 16px; }
.sleepbig.col { flex-direction: column; align-items: flex-start; gap: 8px; }
.bodymap { display: flex; flex-direction: column; gap: 8px; }
.figs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; max-width: 320px; margin: 0 auto; width: 100%; }
.bodymap.compact .figs { max-width: 260px; }
.fig { width: 100%; height: auto; display: block; }
.mus { cursor: pointer; }

  recomp: { name: "리컴프", desc: "근육 유지·지방 조금씩", adj: (t) => -Math.round(t * 0.1), protein: 2.2, fatPct: 0.25 },
  bulk: { name: "벌크업", desc: "근육 증가 (주 0.25~0.5%)", adj: (t) => Math.min(350, Math.round(t * 0.1)), protein: 1.8, fatPct: 0.25 },

function sleepAnalysis() {
  const keys = last7(), rec = keys.map(k => ({ k, s: day(k).sleep })).filter(x => x.s);

/* ---------- sleep dial: a 24-hour clock with the night drawn as an arc ---------- */
function sleepDial(k, size = 150) {
  const s = day(k).sleep, R = 54, C = 70, toXY = (min, r) => { const a = (min / 1440) * 2 * Math.PI - Math.PI / 2; return [C + r * Math.cos(a), C + r * Math.sin(a)]; };
  const m = (t) => { const [h, mm] = t.split(":").map(Number); return h * 60 + mm; };
  let arc = "", icons = "", center = `<text x="70" y="74" text-anchor="middle" font-size="12" fill="var(--muted)">기록 없음</text>`;
  if (s) {
    const b = m(s.bed), w = m(s.wake), len = ((w - b) + 1440) % 1440 || 1440, big = len > 720 ? 1 : 0;
    const [x1, y1] = toXY(b, R), [x2, y2] = toXY(w, R), h = sleepHours(s), pct = Math.min(1, h / sleepNeed());
    arc = `<path class="sleeparc" pathLength="1" d="M${x1.toFixed(1)} ${y1.toFixed(1)} A${R} ${R} 0 ${big} 1 ${x2.toFixed(1)} ${y2.toFixed(1)}" fill="none" stroke="var(--rest)" stroke-width="13" stroke-linecap="round"></path>`
      + (s.wakes || []).map(x => { const a = m(x.at), e = a + Math.max(10, n0(x.min)); const [p1, q1] = toXY(a, R), [p2, q2] = toXY(e, R);
        return `<path class="wakegap" d="M${p1.toFixed(1)} ${q1.toFixed(1)} A${R} ${R} 0 0 1 ${p2.toFixed(1)} ${q2.toFixed(1)}" fill="none" stroke="var(--rec-fg)" stroke-width="13"></path>`; }).join("");
    icons = `<g class="dialicon" transform="translate(${x1.toFixed(1)} ${y1.toFixed(1)})"><circle r="9" fill="var(--surface)"></circle><path d="M2.5 -4.5 A5 5 0 1 0 4.5 2.5 A4 4 0 0 1 2.5 -4.5 Z" fill="var(--rest)"></path></g>
      <g class="dialicon" transform="translate(${x2.toFixed(1)} ${y2.toFixed(1)})"><circle r="9" fill="var(--surface)"></circle><circle r="3.2" fill="#F5A623"></circle>${[0,45,90,135,180,225,270,315].map(a => `<line x1="0" y1="-5" x2="0" y2="-6.6" stroke="#F5A623" stroke-width="1.4" transform="rotate(${a})"></line>`).join("")}</g>`;
    center = `<text x="70" y="70" text-anchor="middle" font-size="19" font-weight="800" fill="var(--ink)">${Math.floor(h)}h ${String(Math.round((h % 1) * 60)).padStart(2, "0")}m</text>
      <text x="70" y="86" text-anchor="middle" font-size="10" fill="${pct >= 1 ? "var(--up)" : h < 6 ? "var(--down)" : "var(--muted)"}">${pct >= 1 ? "충분해요" : `목표의 ${Math.round(pct * 100)}%`}</text>`;
  }
  const ticks = [...Array(24)].map((_, i) => { const [a, b2] = toXY(i * 60, 66), [c, d] = toXY(i * 60, i % 6 ? 64 : 62); return `<line x1="${a.toFixed(1)}" y1="${b2.toFixed(1)}" x2="${c.toFixed(1)}" y2="${d.toFixed(1)}" stroke="var(--muted)" stroke-width="${i % 6 ? 0.8 : 1.4}" opacity=".6"></line>`; }).join("");
  const labels = [[0, "0시"], [360, "6"], [720, "12"], [1080, "18"]].map(([mm, l]) => { const [x, y] = toXY(mm, 36); return `<text x="${x.toFixed(1)}" y="${(y + 3).toFixed(1)}" text-anchor="middle" font-size="8.5" fill="var(--muted)">${l}</text>`; }).join("");
  return `<button class="dial" data-act="sleep" aria-label="수면 기록" style="width:${size}px"><svg viewBox="0 0 140 140" aria-hidden="true">
    <circle cx="70" cy="70" r="${R}" fill="none" stroke="var(--fill)" stroke-width="13"></circle>${ticks}${labels}${arc}${icons}${center}</svg></button>`;
}

/* ---------- nutrition rings ---------- */
function foodRings(k) {
  const t = totals(k), p = nutritionPlan(), kg2 = p.kcal || GOALS.food, pg = p.protein || 0;

    return `<circle cx="60" cy="60" r="${r}" fill="none" stroke="var(--fill)" stroke-width="11"></circle>
      <circle class="ringarc" cx="60" cy="60" r="${r}" fill="none" stroke="${color}" stroke-width="11" stroke-linecap="round" stroke-dasharray="${(f * c).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 60 60)" style="--c:${c.toFixed(1)};--d:${d}ms"></circle>`; };

/* ---------- body heat map: front and back, each muscle reddens with sets done in the last 7 days ---------- */
/* ---------- muscle recovery ----------
   Typical time before training the same muscle hard again (commonly cited 48–72 h; larger muscles and
   heavier sessions need longer). Scaled by that session's sets: ×0.8 for a light session up to ×1.3 for a heavy one. */
const RECOVERY_H = { 하체: 72, 등: 72, 전신: 72, 가슴: 60, 어깨: 48, 이두: 48, 삼두: 48, 복근: 36, 기타: 48 };
function recovery(part) {
  const h = partHistory(part), last = h[h.length - 1];
  if (!last) return null;
  const sets = last.items.reduce((a, it) => a + it.sets.filter(s => n0(s.reps) > 0).length, 0);
  // heavy drinking on the session day or the day after slows recovery
  const heavy = [last.k, shift(last.k, 1)].some(k => dayAlcohol(k).g >= bingeG());
  const P = personal(), ageF = P.age >= 55 ? 1.2 : P.age >= 40 ? 1.1 : 1;
  const sl = day(shift(last.k, 1)).sleep, sleepF = sl && sleepHours(sl) < 6 ? 1.15 : 1;
  const plan = nutritionPlan(), prot = totals(last.k).protein, protF = plan.protein && day(last.k).meals.length && prot < plan.protein * 0.7 ? 1.1 : 1;
  const need = RECOVERY_H[part] * Math.min(1.3, Math.max(0.8, 0.7 + sets / 20)) * (heavy ? 1.25 : 1) * ageF * sleepF * protF;
  const at = n0(last.w.end) || parseKey(last.k).getTime() + 18 * 36e5;   // no end time: assume the evening
  const hrs = (Date.now() - at) / 36e5, pct = Math.max(0, Math.min(1, hrs / need));
  return { pct, left: Math.max(0, Math.ceil(need - hrs)), need: Math.round(need), sets, k: last.k, done: pct >= 1 };
}

  Object.entries(RECOVERY_H).filter(([p]) => p !== "기타" && p !== "전신").map(([p, h]) => `${p} ${h}시간`).join(" · ") +

function partLoad() {
  const tk = todayKey(), load = {}, rec = {};
  PARTS.forEach(p => { const h = partHistory(p).filter(x => x.k > shift(tk, -7));
    load[p] = h.reduce((a, x) => a + x.items.reduce((b, it) => b + it.sets.filter(s => n0(s.reps) > 0).length, 0), 0);
    rec[p] = recovery(p); });
  if (load["전신"]) PARTS.forEach(p => { if (p !== "전신" && p !== "기타") load[p] += load["전신"] / 2; });
  return { load, rec };

/* ---------- alcohol ----------
   Grams of alcohol = ml × ABV × 0.789. One standard drink = 10 g (WHO). Heavy (binge) session follows the Korean
   high-risk definition of 7 soju glasses for men / 5 for women in one sitting (≈ 45 g / 32 g). Alcohol ≥ 1 g/kg after
   training lowers muscle protein synthesis (Parr et al. 2014); alcohol shortens REM sleep. BAC by Widmark,
   eliminating about 0.015 %/h. */

  소주: { abv: 16.5, units: [["1잔", 50], ["반 병", 180], ["1병", 360]], carb: 0 },
  맥주: { abv: 4.5, units: [["1잔", 300], ["1캔", 355], ["500ml", 500]], carb: 3.5 },
  소맥: { abv: 7.5, units: [["1잔", 200]], carb: 2 },
  와인: { abv: 13, units: [["1잔", 150], ["1병", 750]], carb: 2.6 },
  막걸리: { abv: 6, units: [["1사발", 200], ["1병", 750]], carb: 4 },

// Compare today's session with its routine, exercise by exercise (matched by name, in order).

  S.forEach((it, si) => {
    const ri = R.findIndex((x, i) => !used.has(i) && x.name === it.name);

async function analyzeFood(blob, st) {
  const btn = $("ai-btn"), msg = $("ai-msg");
  if (st.ctl) st.ctl.abort();
  st.ctl = new AbortController();
  btn.classList.add("busy"); msg.textContent = "분석 중이에요. 10~30초 걸릴 수 있어요.";
  const hint = $("f-menu").value.trim();
  const prompt = `너는 식단 기록을 돕는다. 첨부한 음식 사진을 보고, 사진에 보이는 양 전체를 기준으로 영양 정보를 추정해.
${hint ? `사용자가 적은 메뉴 힌트: "${hint}"\n` : ""}한국 음식이면 흔히 쓰는 한국어 메뉴명을 쓰고, 여러 음식이면 쉼표로 나열해.
JSON 하나로만 답해. 형식: {"menu":"음식 이름","kcal":정수,"carb":정수(g),"protein":정수(g),"fat":정수(g),"note":"양을 어떻게 추정했는지 한 문장"}
음식 사진이 아니면 {"menu":"","kcal":0,"carb":0,"protein":0,"fat":0,"note":"이유"}로 답해.`;
  try {
    const r = await sample.json(prompt, { images: blob, signal: st.ctl.signal, modelTier: "default" });
    if (sheetState !== st) return;
    if (!r || !r.menu) { msg.textContent = (r && r.note) || "음식을 알아보지 못했어요. 직접 입력해 주세요."; return; }
    $("f-menu").value = r.menu;
    $("f-kcal").value = Math.round(n0(r.kcal)) || "";
    $("f-carb").value = Math.round(n0(r.carb)) || "";
    $("f-protein").value = Math.round(n0(r.protein)) || "";
    $("f-fat").value = Math.round(n0(r.fat)) || "";
    $("f-calc").textContent = "AI 추정값이에요. 실제와 다를 수 있으니 확인하고 저장하세요.";
    msg.textContent = r.note || "분석을 마쳤어요.";
  } catch (e) {
    if (sheetState !== st || e.code === "cancelled") return;
    msg.textContent = e.code === "not_granted" ? "AI 사용을 허용하지 않아서 분석하지 못했어요. 직접 입력해 주세요."
      : e.code === "rate_limited" ? "요청이 많아요. 잠시 후 다시 올려 주세요."
      : "분석하지 못했어요. 직접 입력해 주세요.";
  } finally { btn.classList.remove("busy"); }
}

  const wakeRow = (x) => `<div class="wakerow"><input type="time" class="wk-at" aria-label="깬 시각" value="${esc(x.at || "")}"><input type="number" class="wk-min" inputmode="numeric" min="1" max="300" aria-label="깨어 있던 분" placeholder="분" value="${x.min ? n0(x.min) : ""}"><span>분</span><button type="button" class="del" aria-label="삭제">×</button></div>`;

    $("f-dur").textContent = `잔 시간 ${fmtH(sleepHours(sl))}` + (awakeMin(sl) ? ` (누워 있던 ${fmtH(spanMin(sl.bed, sl.wake) / 60)} − 깬 ${awakeMin(sl)}분)` : "") + " · 일어난 날짜에 저장돼요"; };

    if (wakes.some(x => !x.at || !(x.min >= 1 && x.min <= 300))) return failMsg("깬 시각과 깨어 있던 시간(1~300분)을 입력하세요.");
    if (wakes.some(x => spanMin(bed, x.at) >= spanMin(bed, wake))) return failMsg("깬 시각은 취침과 기상 사이여야 해요.");
    if (wakes.reduce((a, x) => a + x.min, 0) >= spanMin(bed, wake)) return failMsg("깬 시간이 누워 있던 시간보다 길어요.");

async function shrink(file, max = 1600) {
  try {
    const url = URL.createObjectURL(file);
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const scale = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement("canvas");
    c.width = Math.round(img.naturalWidth * scale); c.height = Math.round(img.naturalHeight * scale);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(url);
    return (await new Promise(res => c.toBlob(res, "image/jpeg", 0.82))) || file;
  } catch { return file; }
}
async function uploadPhoto(file) {
  const st = sheetState, slot = {};
  st.photos.push(slot); drawPhotos();
  try {
    const r = await assets.upload(await shrink(file));
    slot.id = r.id; slot.url = r.url;
    if (sheetState !== st) { assets.delete(r.id).catch(() => {}); return; }
  } catch {
    st.photos.splice(st.photos.indexOf(slot), 1);
    if (sheetState === st) failMsg("사진을 저장하지 못했어요. 다시 시도해 주세요.");
